# Reactive Web Firewall - trusted client whitelist
#
# This file is included by Apache and parsed by the privileged RwF helper
# as the single source of truth for trusted IPs/networks.
#
# Syntax:
#   RwfWhitelistIP <ip-or-cidr>
#
# No address is trusted by default. Add only networks/hosts that must bypass RwF.
# Examples (TEST-NET/documentation ranges):
# RwfWhitelistIP 192.0.2.10/32
# RwfWhitelistIP 192.0.2.0/24
# RwfWhitelistIP 2001:db8::1/128
# RwfWhitelistIP 2001:db8::/32
