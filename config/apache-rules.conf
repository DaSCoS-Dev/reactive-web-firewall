# ============================================================
# SYNTAX
# ============================================================
#
# RwfRuleExact       <name> <path>  <policy>
# RwfRulePrefix      <name> <path>  <policy>
# RwfRuleRegex       <name> <regex> <policy>   # path only
# RwfRuleTargetRegex <name> <regex> <policy>   # path + query string
#
# TargetRegex uses a detection-only normalized target. Printable percent
# encodings are decoded for up to two passes, so %2F and %252F cannot be
# used to hide separators from these rules. Apache's URI is not modified.
#
# Supported policies: off, permanent, seconds, 30s, 30m, 4h, 3d, 2w.
# Matching is case-insensitive. First valid match wins.
#

# ============================================================
# 1. GIT / REPOSITORY METADATA
# ============================================================
RwfRuleRegex git-repository "(^|/)[.]git(?:/|$)" permanent
RwfRuleRegex git-credentials "(^|/)[.]git-credentials$" permanent
RwfRuleRegex gitconfig "(^|/)[.]gitconfig$" permanent
RwfRuleRegex gitlab-ci "(^|/)[.]gitlab-ci[.]yml$" permanent
RwfRuleRegex github-workflow "(^|/)[.]github/workflows/[^/]+[.](?:yml|yaml)$" permanent

# ============================================================
# 2. ENVIRONMENT / SECRET CONFIGURATION
# ============================================================
# Mirrors the high-confidence legacy watcher including .env.local/.env-prod.
RwfRuleRegex env-secret "(^|/)[.]env(?:[._-][^/?#]*)?(?:/|$)" permanent
RwfRuleRegex vscode-sftp "(^|/)[.]vscode/sftp[.]json$" permanent
RwfRuleRegex ds-store "(^|/)[.]DS_Store$" permanent
RwfRuleRegex wp-config-secret "(^|/)wp-config[.]php$" permanent

# ============================================================
# 3. AWS CREDENTIALS
# ============================================================
RwfRuleRegex aws-credentials "(^|/)[.]aws/credentials$" permanent
RwfRuleRegex aws-config "(^|/)[.]aws/config$" permanent

# ============================================================
# 4. RCLONE CONFIGURATION
# ============================================================
RwfRuleExact rclone-conf /rclone.conf permanent
RwfRuleExact rclone-hidden-conf /.rclone.conf permanent
RwfRuleExact rclone-user-conf /.config/rclone/rclone.conf permanent

# ============================================================
# 5. WEB SERVER CONFIGURATION
# ============================================================
RwfRuleExact web-config /web.config permanent

# ============================================================
# 6. PHPUNIT / FRAMEWORK PROBES
# ============================================================
RwfRuleRegex phpunit-vendor "(^|/)vendor/(?:[^/]+/)*phpunit(?:/|$)" permanent
RwfRuleRegex phpunit-direct "^/phpunit(?:/|$)" permanent

# ============================================================
# 7. WORDPRESS BATCH/V1 PROBES
# ============================================================
# Covers both /wp-json/batch/v1 and ?rest_route=/batch/v1, including encoded
# slash evasions handled by TargetRegex normalization.
RwfRuleTargetRegex wordpress-batch-v1 "(^/+wp-json/batch/v1(?:/|$|[?]))|([?&;]rest_route=/batch/v1(?:/|$|[&#;]))" 3d

# ============================================================
# 8. HIGH-CONFIDENCE SQL INJECTION PROBES
# ============================================================
# Conservative subset verified in production and compatible with the legacy
# immediate-watcher's SQLi family. It intentionally does not try to become a
# general WAF SQL parser.
RwfRuleTargetRegex sqli-union-select "union[[:space:]]+(?:all[[:space:]]+|distinct[[:space:]]+)?select[[:space:](]" 2w
RwfRuleTargetRegex sqli-mysql-error "(?:extractvalue|updatexml)[[:space:]]*[(]" 2w

# ============================================================
# 9. KNOWN WEBSHELL / BACKDOOR PROBES
# ============================================================
RwfRuleRegex known-webshell-name "(^|/)(?:zwso|mah|shoha|alpha|alpa|alfa|chosen|goods|wp_filemanager|shelp|ms-themes|gifclass|txets|wp_mna|lock360|o-simple|this_is_a_new_hello_world)[.]php$" permanent
RwfRuleExact known-webshell-wso /.wp/wso.php permanent
RwfRuleRegex known-webshell-hellopress "^/wp-content/plugins/hellopress/.*[.]php$" permanent

# ============================================================
# 10. PRODUCTION FIELD SIGNATURES
# ============================================================
# Added after repeated high-confidence probes observed on the production
# reverse proxy during RwF validation.
RwfRuleExact wordpress-wp-plain /wp-plain.php permanent
RwfRuleExact wordpress-seotheme-db /wp-content/themes/seotheme/db.php permanent
RwfRuleExact wordpress-apikey-backdoor /wp-content/plugins/apikey/apikey.php permanent
RwfRuleExact wordpress-apikey-backdoor-suspected /wp-content/plugins/apikey/apikey.php.suspected permanent
RwfRuleRegex alfa-perl-shell "(^|/)(?:ALFA_DATA/)?alfacgiapi/perl[.]alfa$" permanent
RwfRuleExact apismtp-probe /plugins/content/apismtp/apismtp.php 2w
RwfRuleExact apismtp-probe-suspected /plugins/content/apismtp/apismtp.php.suspected 2w

# ============================================================
# 11. PHPMYADMIN STANDARD PATH PROBES
# ============================================================
# INSTALLATION-SPECIFIC: deliberately disabled in the generic package.
# Enable only if these paths are known not to publish a legitimate phpMyAdmin.
# RwfRuleRegex phpmyadmin-standard "^/(?:phpmyadmin|myadmin)(?:/|$)" permanent
# RwfRuleRegex phpmyadmin-admin "^/admin/phpmyadmin(?:/|$)" permanent

# ============================================================
# 12. XML-RPC
# ============================================================
# The legacy immediate watcher banned /xmlrpc.php for 3d. This is deliberately
# disabled by default because WordPress can legitimately use XML-RPC.
# RwfRuleExact wordpress-xmlrpc /xmlrpc.php 3d

# ============================================================
# 13. RESPONSE-CONTEXT LEGACY RULES
# ============================================================
# wp-login and generic root PHP probes are NOT converted into early path-only
# rules. Their legacy logic depended on response status, referrer and/or UA;
# broad early equivalents would materially increase false positives.
# See PERL-RULE-AUDIT.md.

# ============================================================
# 14. KNOWN SCANNER FINGERPRINT
# ============================================================
RwfRuleRegex scanner-debug-trigger "^/z9x8c7v6b5-debug-trigger-[A-Za-z0-9._-]+(?:/|$)" permanent
