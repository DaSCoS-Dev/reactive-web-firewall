#
# log_file may be overridden by the installer.
log_file=/var/log/apache2/other_vhosts_access.log
helper_socket=/run/reactive-web-firewall/helper.sock
active_dir=/run/custom-web-ban/active
tail_sleep=0.1
debounce_seconds=2

# Common high-confidence families.
rule.git-repository=permanent
rule.git-credentials=permanent
rule.gitconfig=permanent
rule.gitlab-ci=permanent
rule.github-workflow=permanent
rule.env-secret=permanent
rule.vscode-sftp=permanent
rule.ds-store=permanent
rule.wp-config-secret=permanent
rule.aws-credentials=permanent
rule.aws-config=permanent
rule.rclone-conf=permanent
rule.rclone-hidden-conf=permanent
rule.rclone-user-conf=permanent
rule.web-config=permanent
rule.phpunit-vendor=permanent
rule.phpunit-direct=permanent
rule.wordpress-batch-v1=3d
rule.sqli-union-select=2w
rule.sqli-mysql-error=2w
rule.known-webshell-name=permanent
rule.known-webshell-wso=permanent
rule.known-webshell-hellopress=permanent
rule.wordpress-wp-plain=permanent
rule.wordpress-seotheme-db=permanent
rule.wordpress-apikey-backdoor=permanent
rule.wordpress-apikey-backdoor-suspected=permanent
rule.alfa-perl-shell=permanent
rule.apismtp-probe=2w
rule.apismtp-probe-suspected=2w
rule.scanner-debug-trigger=permanent

# Installation-sensitive families. Disabled in the generic distribution.
rule.phpmyadmin-standard=off
rule.phpmyadmin-admin=off
rule.wordpress-xmlrpc=off

# Response-context families available only to Log Reader.
rule.wordpress-wp-login-context=4h
rule.generic-root-php-context=1h
