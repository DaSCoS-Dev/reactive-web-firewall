# Dedicated global log consumed by Reactive Web Firewall.
# GlobalLog records every vhost even when that vhost defines its own CustomLog.
# Apache 2.4.19 or newer is required.

LogFormat "%h (%v:%p) %l %u [%{%d/%b/%Y:%H:%M:%S}t.%{msec_frac}t %{%z}t] \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" apache_end_us=%{end:usec}t" reactive_web_combined

# Static assets cannot match the immediate rules and only create log volume.
SetEnvIfNoCase Request_URI "\.(css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|bmp|tiff?|woff2?|woff|ttf|eot|otf|mp4|webm|mp3|wav)(\?.*)?$" rwf_static_asset

GlobalLog ${APACHE_LOG_DIR}/reactive_web_access.log reactive_web_combined env=!rwf_static_asset
